
name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: "8.7"
          
      - name: Extract Project
        run: unzip -q recorder-project.zip -d proj

      - name: Move files up if nested inside recorder-project
        run: |
          if [ -d "proj/recorder-project" ]; then
            echo "Mendeteksi folder recorder-project di dalam ZIP, memindahkan file..."
            mv proj/recorder-project/* proj/ 2>/dev/null || true
            mv proj/recorder-project/.* proj/ 2>/dev/null || true
            rm -rf proj/recorder-project
          fi

      # Perbaikan Total: Membuat file variabel global murni tanpa menggunakan anotasi @Composable yang dilarang
      - name: Create Valid CiGlobals File
        run: |
          TARGET_DIR="proj/app/src/main/java/com/h4ll0/recorder"
          if [ -d "$TARGET_DIR" ]; then
            echo "Membuat ulang file CiGlobals.kt dengan skema objek File murni..."
            cat << 'EOF' > "$TARGET_DIR/CiGlobals.kt"
package com.h4ll0.recorder

import java.io.File

// Membuat file kosong di direktori cache bawaan sistem operasi Linux/Android 
// Ini akan dibaca sebagai objek File biasa oleh CameraScreen dan MicScreen tanpa melanggar aturan Compose
val photosDir: File = File("/tmp/photos").apply { if (!exists()) mkdirs() }
val videosDir: File = File("/tmp/videos").apply { if (!exists()) mkdirs() }
val audioDir: File = File("/tmp/audio").apply { if (!exists()) mkdirs() }
EOF
            echo "File CiGlobals.kt berhasil diverifikasi."
          else
            echo "ERROR: Jalur paket project tidak valid!"
            exit 1
          fi

      - name: Build with Gradle
        run: gradle -p proj assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RecorderH4ll0-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
