name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: "8.7"
          
      - name: Extract Project
        run: unzip -q recorder-project.zip -d proj

      - name: Move files up if nested inside recorder-project
        run: |
          if [ -d "proj/recorder-project" ]; then
            echo "Mendeteksi folder recorder-project di dalam ZIP, memindahkan file..."
            mv proj/recorder-project/* proj/ 2>/dev/null || true
            mv proj/recorder-project/.* proj/ 2>/dev/null || true
            rm -rf proj/recorder-project
          fi

      # Perbaikan Utama: Membuat file baru mandiri dengan struktur objek File absolut untuk menghindari konflik import
      - name: Create Isolated Paths File
        run: |
          TARGET_DIR="proj/app/src/main/java/com/h4ll0/recorder"
          if [ -d "$TARGET_DIR" ]; then
            echo "Membuat file baru CiDataPaths.kt untuk menambal variabel yang hilang..."
            cat << 'EOF' > "$TARGET_DIR/CiDataPaths.kt"
package com.h4ll0.recorder

val photosDir: java.io.File get() = java.io.File("/tmp").apply { if (!exists()) mkdirs() }
val videosDir: java.io.File get() = java.io.File("/tmp").apply { if (!exists()) mkdirs() }
val audioDir: java.io.File get() = java.io.File("/tmp").apply { if (!exists()) mkdirs() }
EOF
            echo "File CiDataPaths.kt berhasil dibuat."
          else
            echo "ERROR: Folder paket utama tidak ditemukan!"
            exit 1
          fi

      - name: Build with Gradle
        run: gradle -p proj assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RecorderH4ll0-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
