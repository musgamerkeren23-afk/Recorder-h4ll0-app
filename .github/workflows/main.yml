name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: "8.7"
          
      - name: Extract Project
        run: unzip -q recorder-project.zip -d proj

      - name: Move files up if nested inside recorder-project
        run: |
          if [ -d "proj/recorder-project" ]; then
            echo "Mendeteksi folder recorder-project di dalam ZIP, memindahkan file..."
            mv proj/recorder-project/* proj/ 2>/dev/null || true
            mv proj/recorder-project/.* proj/ 2>/dev/null || true
            rm -rf proj/recorder-project
          fi

      # Perbaikan Baru: Membuat variabel global pembantu di dalam FilesUtil.kt tanpa merusak Screen lainnya
      - name: Inject Safe Global Variables into FilesUtil
        run: |
          UTIL_FILE="proj/app/src/main/java/com/h4ll0/recorder/FilesUtil.kt"
          if [ -f "$UTIL_FILE" ]; then
            echo "Menginjeksikan variabel global independen ke dalam FilesUtil.kt..."
            
            # Kita buat deklarasi variabel tiruan di luar objek agar bisa diakses langsung oleh CameraScreen dan MicScreen tanpa merusak kode
            cat << 'EOF' >> "$UTIL_FILE"

// Tambahan otomatis dari CI untuk menyelesaikan masalah Unresolved Reference
import android.annotation.SuppressLint
import androidx.compose.runtime.Composable
import androidx.compose.ui.platform.LocalContext
import java.io.File

val photosDir: File
    @SuppressLint("ComposableNaming")
    @Composable get() = LocalContext.current.getExternalFilesDir(android.os.Environment.DIRECTORY_PICTURES)!!

val videosDir: File
    @SuppressLint("ComposableNaming")
    @Composable get() = LocalContext.current.getExternalFilesDir(android.os.Environment.DIRECTORY_MOVIES)!!

val audioDir: File
    @SuppressLint("ComposableNaming")
    @Composable get() = LocalContext.current.getExternalFilesDir(android.os.Environment.DIRECTORY_MUSIC)!!
EOF
          fi

      - name: Build with Gradle
        run: gradle -p proj assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RecorderH4ll0-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
