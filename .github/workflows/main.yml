name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: "8.7"
          
      - name: Extract Project
        run: unzip -q recorder-project.zip -d proj

      - name: Move files up if nested inside recorder-project
        run: |
          if [ -d "proj/recorder-project" ]; then
            echo "Mendeteksi folder recorder-project di dalam ZIP, memindahkan file..."
            mv proj/recorder-project/* proj/ 2>/dev/null || true
            mv proj/recorder-project/.* proj/ 2>/dev/null || true
            rm -rf proj/recorder-project
          fi

      # Solusi Pasti: Menyisipkan inisialisasi java.io.File murni langsung ke root internal aplikasi (tanpa merusak kurung kurawal)
      - name: Auto Inject Missing Directory Variables
        run: |
          # 1. Suntik variabel langsung di baris paling atas file CameraScreen.kt setelah package
          CAM_FILE="proj/app/src/main/java/com/h4ll0/recorder/CameraScreen.kt"
          if [ -f "$CAM_FILE" ]; then
            echo "Patching CameraScreen.kt..."
            sed -i '/package com.h4ll0.recorder/a \\nimport java.io.File\nval photosDir = File("/tmp").apply { mkdirs() }\nval videosDir = File("/tmp").apply { mkdirs() }' "$CAM_FILE"
          fi

          # 2. Suntik variabel langsung di baris paling atas file MicScreen.kt setelah package
          MIC_FILE="proj/app/src/main/java/com/h4ll0/recorder/MicScreen.kt"
          if [ -f "$MIC_FILE" ]; then
            echo "Patching MicScreen.kt..."
            sed -i '/package com.h4ll0.recorder/a \\nimport java.io.File\nval audioDir = File("/tmp").apply { mkdirs() }' "$MIC_FILE"
          fi

      - name: Build with Gradle
        run: gradle -p proj assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RecorderH4ll0-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
